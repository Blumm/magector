name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            binary: magector-core
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: magector-core
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: magector-core
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: magector-core.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Sync Cargo.toml version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" rust-core/Cargo.toml
          rm -f rust-core/Cargo.toml.bak
          echo "Cargo.toml version synced to ${VERSION}"

      - name: Link libstdc++ statically (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The x64 binary must run in Warden / CentOS Stream 9 PHP containers (GCC 11
          # libstdc++): linked dynamically it picks up GLIBCXX_3.4.30 from the build host.
          # rustc links with -nodefaultlibs, so -static-libstdc++ would add nothing: silence
          # the two sources of -lstdc++ (ort-sys, and the cc crate for esaxx-rs) and append
          # libstdc++.a after every archive. -lgcc brings the aarch64 outline-atomics helpers
          # libstdc++.a needs. The glibc_compat stubs are linked whole-archive (build.rs).
          {
            echo "ORT_CXX_STDLIB="
            echo "CXXSTDLIB="
            echo "RUSTFLAGS=-C link-arg=-l:libstdc++.a -C link-arg=-lgcc"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: rust-core
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary
        shell: bash
        run: |
          mkdir -p platforms/${{ matrix.platform }}/bin
          cp rust-core/target/${{ matrix.target }}/release/${{ matrix.binary }} \
             platforms/${{ matrix.platform }}/bin/

      - name: Portability check (linux-arm64)
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          BIN=platforms/linux-arm64/bin/magector-core
          # Capture objdump's output first: a missing objdump then fails the step, and
          # `grep -q` closing the pipe early cannot turn the check into a silent pass.
          headers=$(aarch64-linux-gnu-objdump -p "$BIN")
          if grep -q 'NEEDED.*libstdc++' <<< "$headers"; then
            echo "::error::the arm64 magector-core links libstdc++ dynamically"; exit 1
          fi
          symbols=$(aarch64-linux-gnu-objdump -T "$BIN")
          newest=$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' <<< "$symbols" | sort -Vu | tail -1)
          echo "newest glibc symbol version: $newest"
          if [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::the arm64 magector-core needs $newest (> GLIBC_2.34) — it will not run on CentOS Stream 9 / RHEL 9"; exit 1
          fi

      - name: Portability smoke test (linux-x64)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          BIN=platforms/linux-x64/bin/magector-core
          if objdump -p "$BIN" | grep -q 'NEEDED.*libstdc++'; then
            echo "::error::magector-core links libstdc++ dynamically — it will not run on Warden / CentOS Stream 9"
            objdump -p "$BIN" | grep NEEDED
            exit 1
          fi
          docker run --rm -v "$PWD/platforms/linux-x64/bin:/b:ro" quay.io/centos/centos:stream9 /b/magector-core --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports trusted publishing (>=11.5.1)
        run: npm install -g npm@12.0.2

      - name: Strip stale _authToken line (breaks OIDC trusted-publish detection)
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: platforms/

      - name: Sync versions and publish platform packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: ${VERSION}"
          for dir in platforms/*/; do
            platform=$(basename "$dir")
            # Skip platforms without a binary (no artifact)
            if [ ! -f "${dir}bin/magector-core" ] && [ ! -f "${dir}bin/magector-core.exe" ]; then
              echo "Skipping ${platform} — no binary found"
              continue
            fi
            # Sync version from root package.json into platform package.json
            node -e "
              const pkg = require('./${dir}package.json');
              pkg.version = '${VERSION}';
              require('fs').writeFileSync('./${dir}package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "Publishing @magector/cli-${platform}@${VERSION}..."
            cd "$dir"
            npm publish --access public || echo "Failed to publish ${platform}, continuing..."
            cd ../..
          done

      - name: Sync optionalDependencies version and publish main package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const pkg = require('./package.json');
            for (const key of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[key] = '${VERSION}';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public
